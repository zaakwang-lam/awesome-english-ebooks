name: Sync Economist Only

on:
  schedule:
    # Every day at 02:00 UTC (Beijing 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-economist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: |
            01_economist
            .github
          sparse-checkout-cone-mode: true

      - name: Fetch upstream Economist only
        run: |
          git remote add upstream https://github.com/hehonghui/awesome-english-ebooks.git || true
          git fetch upstream master --depth=1
          # Extract only the 01_economist directory from upstream
          git checkout upstream/master -- 01_economist

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_economist
          if git diff --cached --quiet; then
            echo "No changes in Economist files."
          else
            git commit -m "Sync Economist (01_economist) from upstream"
            git push
            echo "Economist files synced."
          fi
